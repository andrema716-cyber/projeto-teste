<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Caixa PDV</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .navbar {
      background: #1e293b;
      padding: 1rem 0;
      border-bottom: 2px solid #334155;
    }

    .navbar-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .logo span {
      color: #22c55e;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid #475569;
      color: #cbd5e1;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-btn.active, .nav-btn:hover {
      background: #22c55e;
      color: #0f172a;
      border-color: #22c55e;
    }

    .aba-conteudo {
      display: none;
      padding: 2rem 0;
    }

    .aba-conteudo.active {
      display: block;
    }

    .pdv-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 850px) {
      .pdv-grid {
        grid-template-columns: 1fr;
      }
    }

    .card-leitura {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }

    .card-leitura h2 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: #94a3b8;
    }

    .input-barcode-group {
      display: flex;
      gap: 0.5rem;
    }

    .input-barcode-group input {
      flex: 1;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 2px solid #3b82f6;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .input-barcode-group button {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0 1.2rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .card-produto-destaque {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      gap: 1.5rem;
      align-items: center;
      border: 1px solid #334155;
    }

    .img-container img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      background: #0f172a;
    }

    .info-container .tag-status {
      font-size: 0.75rem;
      background: #334155;
      color: #38bdf8;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .info-container h3 {
      font-size: 1.2rem;
      margin: 0.5rem 0;
    }

    .preco-destaque {
      font-size: 1.8rem;
      font-weight: 700;
      color: #22c55e;
    }

    .painel-carrinho {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .tabela-container {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.8rem;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .painel-total {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px dashed #334155;
      text-align: right;
    }

    .total-label {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .total-valor {
      font-size: 2.5rem;
      font-weight: 700;
      color: #22c55e;
      margin-bottom: 1rem;
    }

    .btn-finalizar {
      width: 100%;
      padding: 1rem;
      background: #22c55e;
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card-form, .card-lista-produtos {
      background: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: #cbd5e1;
    }

    .form-group input {
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }

    .btn-salvar {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .lista-cadastrados {
      list-style: none;
      margin-top: 1rem;
    }

    .lista-cadastrados li {
      background: #0f172a;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- Navegação superior -->
  <header class="navbar">
    <div class="container navbar-content">
      <div class="logo">Caixa<span>PDV</span></div>
      <nav>
        <button id="btnAbaCaixa" class="nav-btn active">🛒 Caixa / Vendas</button>
        <button id="btnAbaCadastro" class="nav-btn">📦 Cadastrar Produtos</button>
      </nav>
    </div>
  </header>

  <main class="container main-content">

    <!-- SEÇÃO 1: TELA DE CAIXA / VENDAS -->
    <section id="secaoCaixa" class="aba-conteudo active">
      <div class="pdv-grid">
        
        <!-- Esquerda: Entrada de Código e Destaque do Produto -->
        <div class="painel-leitura">
          <div class="card-leitura">
            <h2>Passar Produto</h2>
            <div class="input-barcode-group">
              <input type="text" id="codigoBarrasInput" placeholder="Bipe ou digite o Código..." autofocus>
              <button id="btnAdicionarManual">Adicionar</button>
            </div>
          </div>

          <!-- Destaque do produto lido atualmente -->
          <div class="card-produto-destaque" id="produtoDestaque">
            <div class="img-container">
              <img id="destaqueImg" src="https://via.placeholder.com/150?text=Sem+Foto" alt="Foto do Produto">
            </div>
            <div class="info-container">
              <span class="tag-status">Último Item Lido</span>
              <h3 id="destaqueNome">Aguardando produto...</h3>
              <div class="preco-destaque">R$ <span id="destaquePreco">0,00</span></div>
            </div>
          </div>
        </div>

        <!-- Direita: Lista da Compra e Total -->
        <div class="painel-carrinho">
          <h2>Itens da Venda</h2>
          <div class="tabela-container">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Qtd</th>
                  <th>Unit.</th>
                  <th>Subtotal</th>
                </tr>
              </thead>
              <tbody id="listaCarrinho">
                <!-- Itens serão inseridos via JavaScript -->
              </tbody>
            </table>
          </div>

          <div class="painel-total">
            <div class="total-label">TOTAL A PAGAR:</div>
            <div class="total-valor">R$ <span id="valorTotal">0,00</span></div>
            <button id="btnFinalizarVenda" class="btn-finalizar">Finalizar Venda</button>
          </div>
        </div>

      </div>
    </section>

    <!-- SEÇÃO 2: CADASTRO DE PRODUTOS -->
    <section id="secaoCadastro" class="aba-conteudo">
      <div class="card-form">
        <h2>Cadastrar Novo Produto</h2>
        <form id="formCadastro">
          <div class="form-group">
            <label>Código de Barras:</label>
            <input type="text" id="cadCodigo" placeholder="Ex: 7891234567890" required>
          </div>
          <div class="form-group">
            <label>Descrição / Nome do Produto:</label>
            <input type="text" id="cadNome" placeholder="Ex: Refrigerante 2L" required>
          </div>
          <div class="form-group">
            <label>Preço de Venda (R$):</label>
            <input type="number" step="0.01" id="cadPreco" placeholder="Ex: 8.50" required>
          </div>
          <div class="form-group">
            <label>URL da Foto do Produto (Opcional):</label>
            <input type="url" id="cadFoto" placeholder="https://link-da-imagem.com/foto.jpg">
          </div>
          <button type="submit" class="btn-salvar">Salvar Produto</button>
        </form>
      </div>

      <div class="card-lista-produtos">
        <h3>Produtos Cadastrados (<span id="totalCadastrados">0</span>)</h3>
        <ul id="listaProdutosCadastrados" class="lista-cadastrados">
          <!-- Produtos cadastrados aparecerão aqui -->
        </ul>
      </div>
    </section>

  </main>

  <script./ src="script.js"></script>
</body>
</html>
