<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV Plug & Play v5.0</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header & Menu */
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .logo { font-size: 1.25rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.5rem; }
    .status-badge { font-size: 0.75rem; padding: 0.2rem 0.5rem; background: #e0e7ff; color: #3730a3; border-radius: 9999px; }
    
    .menu-container { position: relative; }
    .menu-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 0.2rem 0.6rem; border-radius: 0.375rem; }
    .menu-btn:hover { background: #f1f5f9; }
    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      width: 220px;
      z-index: 50;
    }
    .dropdown-menu.active { display: block; }
    .dropdown-item {
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      font-size: 0.9rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .dropdown-item:hover { background: #f8fafc; }
    .dropdown-item:last-child { border-bottom: none; }

    /* Layout Principal */
    main { display: flex; flex: 1; overflow: hidden; }
    
    /* Painel Esquerdo: Busca e Itens */
    .left-panel { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; border-right: 1px solid var(--border); }
    .search-box { display: flex; gap: 0.5rem; }
    .search-box input {
      flex: 1;
      padding: 0.75rem;
      border: 2px solid var(--border);
      border-radius: 0.5rem;
      font-size: 1rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }

    .cart-table-wrapper { flex: 1; overflow-y: auto; background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    th { background: #f8fafc; font-weight: 600; position: sticky; top: 0; }
    .btn-qty { padding: 0.2rem 0.5rem; border: 1px solid var(--border); background: #f1f5f9; border-radius: 0.25rem; cursor: pointer; }
    .btn-del { color: var(--danger); background: none; border: none; cursor: pointer; font-weight: bold; }

    /* Painel Direito: Resumo e Pagamento */
    .right-panel { width: 360px; background: var(--card); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; }
    .totals { display: flex; flex-direction: column; gap: 0.75rem; }
    .total-row { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 600; }
